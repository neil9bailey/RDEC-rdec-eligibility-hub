version: "2026-05-07"
review_status: "verified against official GOV.UK/HMRC guidance on 2026-05-07"
caveat: "Decision support only. Requires competent professional and tax review."
automatic_blockers:
  - code: "missing_field"
    label: "No field of science or technology"
  - code: "missing_advance"
    label: "No advance sought"
  - code: "non_technical_advance"
    label: "Advance appears only commercial, aesthetic, project management, procurement, or internal learning"
  - code: "missing_uncertainty"
    label: "No scientific or technological uncertainty"
  - code: "non_technical_uncertainty"
    label: "Uncertainty appears only commercial, budgetary, resourcing, customer adoption, or implementation planning"
  - code: "missing_competent_professional_signoff"
    label: "No signed competent professional opinion"
  - code: "missing_evidence"
    label: "No evidence linked to the project"
  - code: "missing_costs"
    label: "No linked costs for a claimed project"
  - code: "entitlement_blocked"
    label: "Customer/supplier entitlement is blocked"
  - code: "missing_accounting_period"
    label: "Missing accounting period"
  - code: "aif_timing_risk"
    label: "Additional Information Form timing risk"
